# NEW HOST ONLY: never combine with an existing ingress proxy on this host.
services:
  proxy:
    image: traefik:v3.7.16
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:?Set a new unique network name}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=${TRAEFIK_ENTRYPOINT:?Set the HTTPS entrypoint}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.${TRAEFIK_ENTRYPOINT:?Set the HTTPS entrypoint}.address=:443
      - --certificatesresolvers.${TRAEFIK_CERTRESOLVER:?Set the new resolver}.acme.email=${ACME_EMAIL:?Operator must supply an ACME registration email}
      - --certificatesresolvers.${TRAEFIK_CERTRESOLVER:?Set the new resolver}.acme.storage=/acme/acme.json
      - --certificatesresolvers.${TRAEFIK_CERTRESOLVER:?Set the new resolver}.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - standalone-acme:/acme
    networks:
      - traefik
    labels:
      traefik.enable: "false"
    restart: unless-stopped
networks:
  traefik: !override
    external: false
    driver: bridge
    name: ${TRAEFIK_NETWORK:?Set a new unique network name}
volumes:
  standalone-acme:
