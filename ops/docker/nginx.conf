server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  location = /healthz { proxy_pass http://backend:8000/healthz; }
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /site-config.json { alias /config/site.json; add_header Cache-Control "no-store"; }
  location = /mobile/site-config.json { alias /config/site.json; add_header Cache-Control "no-store"; }
  location = /site-config.js { alias /tmp/site-config.js; default_type application/javascript; add_header Cache-Control "no-store"; }
  location = /mobile/site-config.js { alias /tmp/site-config.js; default_type application/javascript; add_header Cache-Control "no-store"; }
  location = /site-logo.svg { alias /etc/nginx/site-logo.svg; }
  # Compatibility redirect for the original Uni-App H5 root paths.
  location ^~ /pages/ { return 302 /mobile$request_uri; }
  location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
